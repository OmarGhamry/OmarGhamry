<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#020817"/><stop offset=".5" stop-color="#071B36"/><stop offset="1" stop-color="#020817"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BAE6FD"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#0EA5E9" stop-opacity=".3"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#7DD3FC" stroke-opacity=".075"/></pattern>
</defs>
<style>
 @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
 @keyframes scan{0%{transform:translateY(0);opacity:0}12%{opacity:.55}88%{opacity:.55}100%{transform:translateY(510px);opacity:0}}
 @keyframes dash{to{stroke-dashoffset:-34}}
 @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
 .glow{animation:breathe 3.2s ease-in-out infinite}.wire{stroke-dasharray:7 10;animation:dash 5s linear infinite}.scan{animation:scan 8s linear infinite}.node{animation:blink 2s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="620" rx="24" fill="url(#bg)"/><rect width="1200" height="620" rx="24" fill="url(#grid)"/>
